
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smartphone Addiction Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0eaff, #f5e9ff);
            color: #243047;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #4936a8;
        }

        .description {
            text-align: center;
            color: #606779;
            line-height: 1.6;
        }

        h2 {
            margin-top: 28px;
            color: #4936a8;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd2e0;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #8a7be8;
            border-color: #6554c0;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #5542b5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #40308f;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .result h2 {
            margin-top: 0;
            color: inherit;
        }

        .low {
            background: #e6f7eb;
            color: #176534;
        }

        .moderate {
            background: #fff4d6;
            color: #805600;
        }

        .high {
            background: #ffe7e7;
            color: #a52222;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #ffe7e7;
            color: #a52222;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: #72798a;
            line-height: 1.8;
        }

        @media (max-width: 550px) {
            .container {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>📱 Smartphone Addiction Prediction</h1>

    <p class="description">
        Enter the student's details and smartphone usage habits
        to obtain a machine-learning prediction.
    </p>

    <form method="POST">

        <h2>Student Information</h2>

        <div class="form-grid">

            <div class="field">
                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    min="10"
                    max="100"
                    value="{{ form_data.get('age', '18') }}"
                    required
                >
            </div>

            <div class="field">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    {% for option in ['Male', 'Female', 'Other'] %}
                    <option
                        value="{{ option }}"
                        {% if form_data.get('gender', 'Male') == option %}
                        selected
                        {% endif %}
                    >
                        {{ option }}
                    </option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <h2>Smartphone Usage</h2>

        <div class="form-grid">

            <div class="field">
                <label for="daily_usage">
                    Daily smartphone usage (hours)
                </label>
                <input
                    type="number"
                    id="daily_usage"
                    name="daily_usage"
                    min="0"
                    max="24"
                    step="0.1"
                    value="{{ form_data.get('daily_usage', '5') }}
